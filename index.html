<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="description" content="Track income and expenses in Indian rupees with a guided transaction form, sortable history, line and donut charts, reports, and help." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenso | Personal Finance in Indian Rupees</title>
    <!-- Prevent dark-mode flash on load -->
    <script>
      try {
        const s = JSON.parse(localStorage.getItem('expense-tracker') || '{}');
        if (s?.state?.theme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
